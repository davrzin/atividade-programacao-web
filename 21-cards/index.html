<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitrine da bancada | Questão 21</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="pagina cabecalho">
    <p class="faixa">
      <span class="selo">Questão 21</span>
      <a class="voltar" href="../index.html">Voltar aos exercícios</a>
    </p>
    <h1>Vitrine da bancada</h1>
    <p class="introducao">Passe o mouse sobre um item para ver o card subir.</p>
  </header>

  <main class="pagina">
    <section class="cards" aria-label="Produtos">
      <article class="card">
        <img src="imagens/teclado.svg" alt="Teclado compacto verde visto de cima" width="480" height="300">
        <div class="card-conteudo">
          <h2>Teclado</h2>
          <p class="preco">R$ 150,00</p>
          <button class="botao" type="button" aria-label="Comprar teclado">Comprar</button>
        </div>
      </article>
      <article class="card">
        <img src="imagens/mouse.svg" alt="Mouse lilás com botão de rolagem" width="480" height="300">
        <div class="card-conteudo">
          <h2>Mouse</h2>
          <p class="preco">R$ 80,00</p>
          <button class="botao" type="button" aria-label="Comprar mouse">Comprar</button>
        </div>
      </article>
      <article class="card">
        <img src="imagens/headset.svg" alt="Headset amarelo com microfone ajustável" width="480" height="300">
        <div class="card-conteudo">
          <h2>Headset</h2>
          <p class="preco">R$ 220,00</p>
          <button class="botao" type="button" aria-label="Comprar headset">Comprar</button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
